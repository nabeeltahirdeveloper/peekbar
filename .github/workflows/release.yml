name: Release

# Push a tag like v0.2.0 and this builds a universal PeekBar.app, wraps it in a DMG
# and attaches it to a GitHub Release. The landing page picks the newest DMG up automatically.
#
# The CI build is ad-hoc signed (no Developer ID in the runner), so users still need
# right-click ▸ Open on first launch. To ship a notarized build instead, sign locally with
# SIGN_IDENTITY set and upload the DMG to the release by hand.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: swift test
      - name: Build app
        run: Scripts/build_app.sh
      - name: Make DMG
        run: Scripts/make_dmg.sh
      - name: Create release and attach DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DMG=$(ls dist/PeekBar-*.dmg | head -n1)
          NOTES="Unsigned build from CI. First launch: right-click PeekBar.app ▸ Open ▸ Open, or run \`xattr -dr com.apple.quarantine /Applications/PeekBar.app\`. Requires macOS 12 or later."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A release published by hand (e.g. a locally signed DMG) wins over the CI build.
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -q '\.dmg$'; then
              echo "Release $TAG already has a DMG attached; leaving it as is."
              exit 0
            fi
            gh release upload "$TAG" "$DMG"
          else
            gh release create "$TAG" "$DMG" --title "PeekBar ${TAG#v}" --generate-notes --notes "$NOTES"
          fi
