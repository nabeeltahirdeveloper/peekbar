name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: swift test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run unit tests
        run: swift test
      - name: Build release binary
        run: swift build -c release --product PeekBar
