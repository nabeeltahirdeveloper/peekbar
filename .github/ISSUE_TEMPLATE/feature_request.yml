name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like PeekBar to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
